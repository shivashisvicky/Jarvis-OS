<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS Video Player Demo</title>
<style>
body{font:16px system-ui;background:#070b10;color:#eee;max-width:960px;margin:40px auto;padding:0 18px}main{display:grid;gap:16px}form{display:flex;gap:8px}input{flex:1;padding:14px;border-radius:8px;border:1px solid #444;background:#111;color:#fff}button{padding:14px 18px;border:0;border-radius:8px;cursor:pointer}.result{display:block;width:100%;padding:14px;border:1px solid #333;border-radius:10px;text-align:left;cursor:pointer;background:#111;color:#eee}.muted{color:#999}#status{min-height:24px}video{width:100%;max-height:70vh;background:#000;border-radius:10px}
</style>
</head>
<body>
<main>
<h1>JARVIS Video Player</h1>
<form id="searchForm"><input id="query" autocomplete="off" placeholder="Search videos, e.g. cats, lofi hip hop"><button>SEARCH</button></form>
<div id="status" class="muted">Ready.</div>
<section id="results"></section>
<video id="player" controls playsinline preload="metadata"></video>
</main>
<script>
const form=document.querySelector('#searchForm'),query=document.querySelector('#query'),results=document.querySelector('#results'),status=document.querySelector('#status'),player=document.querySelector('#player');
form.addEventListener('submit',async e=>{
 e.preventDefault();const q=query.value.trim();if(!q)return;
 status.textContent='Searching live…';results.replaceChildren();player.removeAttribute('src');player.load();
 try{
  const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Search failed');
  const x=d.result,card=document.createElement('button');card.className='result';card.type='button';
  const title=document.createElement('strong');title.textContent=x.title;
  const meta=document.createElement('div');meta.className='muted';meta.textContent=x.webpageUrl;
  card.append(title,meta);results.append(card);
  card.addEventListener('click',()=>{player.src='/api/media?url='+encodeURIComponent(x.mediaUrl);player.play().catch(()=>{});status.textContent='Playing: '+x.title;});
  card.click();
 }catch(err){status.textContent='ERROR: '+(err instanceof Error?err.message:String(err));}
});
</script>
</body>
</html>
