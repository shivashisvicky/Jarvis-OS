name: Deploy Jarvis OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-pages-main
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.15.0

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Jarvis OS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build
      - name: Verify generated YouTube configuration
        run: test -s dist/jarvis-youtube-config.js
      - name: Verify media entrypoint exists in deploy artifact
        run: |
          test -f dist/index.html
          grep -q 'data-app="media"' dist/index.html
          grep -q 'videoQuery' dist/index.html
          grep -q 'jarvisPlayer' dist/index.html
          echo 'DEPLOY_ARTIFACT_MEDIA_ENTRYPOINT=1'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy production Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-media-smoke:
    name: Live / Media Search
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed HTML contains current media entrypoint
        run: |
          set -e
          URL="https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}"
          for attempt in $(seq 1 20); do
            echo "Deployment verification attempt ${attempt}/20"
            if curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/deployed-index.html; then
              if grep -q 'data-app="media"' /tmp/deployed-index.html && grep -q 'videoQuery' /tmp/deployed-index.html && grep -q 'jarvisPlayer' /tmp/deployed-index.html; then
                echo 'DEPLOYED_HTML_MEDIA_ENTRYPOINT=1'
                break
              fi
            fi
            if [ "$attempt" = 20 ]; then
              echo '=== DEPLOYED HTML ==='
              cat /tmp/deployed-index.html || true
              exit 1
            fi
            sleep 5
          done
      - name: Verify deployed media search
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}
        run: pnpm exec playwright test tests/e2e/live-media.spec.ts --project=chromium
      - name: Upload deployed media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-media-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            /tmp/deployed-index.html
          if-no-files-found: ignore
          retention-days: 14
