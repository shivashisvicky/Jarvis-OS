name: Deploy Jarvis OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jarvis-pages-main
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.15.0

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Intelligence gateway syntax
        run: node --check api/openai-intelligence.js
      - name: Check YouTube API configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo 'YOUTUBE_API_KEY_CONFIGURED=0'
            echo 'YouTube Data API key is optional. Media search will use the local/fallback provider path.'
          else
            echo 'YOUTUBE_API_KEY_CONFIGURED=1'
          fi
      - name: Build Jarvis OS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build
      - name: Verify generated YouTube configuration
        run: |
          set -euo pipefail
          test -s dist/jarvis-youtube-config.js
          grep -q 'window.JARVIS_YOUTUBE_API_KEY=' dist/jarvis-youtube-config.js
      - name: Verify current shell artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/jarvis-media-layout.css
          test -s dist/jarvis-video-search-v3.css
          test -s dist/jarvis-intelligence-runtime.js
          grep -q 'jarvis-intelligence-runtime.js' dist/index.html
          grep -q 'jarvis-intelligence-endpoint' dist/index.html
          grep -q 'src/main.ts' dist/index.html || grep -q 'assets/index-' dist/index.html
          ! grep -q 'jarvis-web-shell.js' dist/index.html
          ! grep -q 'jarvis-media-v14.js' dist/index.html
          ! grep -q 'jarvis-shell-search.css' dist/index.html
          ! grep -q 'jarvis-video-provider.js' dist/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy production Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  live-media-smoke:
    name: Live / Media Search
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed media surface
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}
        run: pnpm exec playwright test tests/e2e/live-media.spec.ts --project=chromium
      - name: Upload deployed media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-media-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  live-web-smoke:
    name: Live / In-Shell Web Search
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed web search stays in shell
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}
        run: pnpm exec playwright test tests/e2e/in-shell-search.spec.ts --project=chromium
      - name: Upload deployed web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-web-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  live-home-news:
    name: Live / Home + News + Voice
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed Home + News + Voice
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}
        run: pnpm exec playwright test tests/e2e/live-home-news.spec.ts tests/e2e/home-intelligence.spec.ts --project=chromium
      - name: Upload Home + News + Voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-home-news-voice-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
