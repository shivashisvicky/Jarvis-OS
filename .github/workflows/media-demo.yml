name: Media Demo Live Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  media-demo:
    name: Keyword search and playable stream
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --upgrade pip 'yt-dlp[default]>=2025.11.12'
      - name: Syntax check
        run: python -m py_compile video-player-demo/server.py
      - name: Start demo service
        run: |
          python video-player-demo/server.py > /tmp/jarvis-media.log 2>&1 &
          echo $! > /tmp/jarvis-media.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/health && exit 0; sleep 1; done
          cat /tmp/jarvis-media.log
          exit 1
      - name: Live keyword search gate
        run: |
          curl --fail --retry 2 --retry-delay 2 --get 'http://127.0.0.1:8765/api/search' --data-urlencode 'q=cats' -o /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          r=d.get('result') or {}
          assert r.get('id'), 'missing real video id'
          assert r.get('title'), 'missing title'
          assert r.get('webpageUrl','').startswith(('http://','https://')), 'missing source URL'
          assert r.get('mediaUrl','').startswith(('http://','https://')), 'missing playable media URL'
          print('LIVE RESULT:', r['id'], r['title'])
          PY
      - name: Verify media proxy can open the stream
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          r=json.load(open('/tmp/result.json'))['result']
          url='http://127.0.0.1:8765/api/media?url='+urllib.parse.quote(r['mediaUrl'], safe='')
          req=urllib.request.Request(url, headers={'Range':'bytes=0-1023'})
          with urllib.request.urlopen(req, timeout=30) as x:
              data=x.read(1024)
              assert data, 'media proxy returned zero bytes'
              print('PLAYABLE BYTES:', len(data), x.headers.get('Content-Type'))
          PY
      - name: Dump media log on failure
        if: failure()
        run: cat /tmp/jarvis-media.log
