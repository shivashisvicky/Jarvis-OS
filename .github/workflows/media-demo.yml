name: Media Demo Live Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  media-demo:
    name: Media UI / Live YouTube Search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build

      - name: Verify built media entrypoint
        run: |
          test -f dist/index.html
          grep -q 'data-app="media"' dist/index.html
          grep -q 'videoQuery' dist/index.html
          grep -q 'jarvisPlayer' dist/index.html

      - name: Run media UI gate
        run: pnpm exec playwright test tests/e2e/live-media.spec.ts --project=chromium

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-ui-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
