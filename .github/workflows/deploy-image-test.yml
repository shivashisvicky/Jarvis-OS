name: Deploy JARVIS Vision TEST Worker

on:
  push:
    branches: [test/jarvis-intelligence-next]
    paths:
      - 'workers/image-test/**'
      - '.github/workflows/deploy-image-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy isolated JARVIS Vision TEST Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then echo "Missing GitHub secret: $name"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker
        run: node --check workers/image-test/src/index.js
      - name: Prepare Wrangler configuration
        working-directory: workers/image-test
        run: |
          set -euo pipefail
          sed -i "s/__CLOUDFLARE_ACCOUNT_ID__/${CLOUDFLARE_ACCOUNT_ID}/" wrangler.toml
          cat wrangler.toml
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy isolated TEST Worker
        working-directory: workers/image-test
        run: wrangler deploy --name jarvis-image-test
      - name: Smoke test endpoint
        run: |
          set -euo pipefail
          endpoint='https://jarvis-image-test.shivashisvicky112.workers.dev/api/image'
          status=$(curl --silent --show-error --output /tmp/jarvis-image-smoke.json --write-out '%{http_code}' -H 'Origin: https://shivashisvicky.github.io' -H 'Content-Type: application/json' -X POST "$endpoint" --data '{}')
          cat /tmp/jarvis-image-smoke.json
          test "$status" = 400
          echo "VISION_WORKER_ROUTE_SMOKE=PASS http=$status"
      - name: Smoke test faithful Enhance
        run: |
          set -euo pipefail
          endpoint='https://jarvis-image-test.shivashisvicky112.workers.dev/api/enhance'
          python - <<'PY'
          import json
          body = {'image': 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=', 'mimeType': 'image/png'}
          with open('/tmp/jarvis-enhance-smoke.json', 'w') as f: json.dump(body, f)
          PY
          status=$(curl --silent --show-error --output /tmp/jarvis-enhance-response.json --write-out '%{http_code}' -H 'Origin: https://shivashisvicky.github.io' -H 'Content-Type: application/json' -X POST "$endpoint" --data-binary @/tmp/jarvis-enhance-smoke.json)
          cat /tmp/jarvis-enhance-response.json
          test "$status" = 200
          python - <<'PY'
          import json
          x=json.load(open('/tmp/jarvis-enhance-response.json'))
          assert x.get('ok') is True
          assert x.get('faithful') is True
          assert x.get('provider') == 'cloudflare-images'
          assert x.get('image', {}).get('width') == 1
          assert x.get('image', {}).get('height') == 1
          assert x.get('image', {}).get('data')
          print('VISION_FAITHFUL_ENHANCE_SMOKE=PASS 1x1')
          PY
