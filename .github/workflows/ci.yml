name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Unit tests
        id: unit
        if: always()
        continue-on-error: true
        run: npm test -- --reporter=dot
      - name: Security audit
        id: audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=critical
      - name: Quality verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outcome }} build=${{ steps.build.outcome }} unit=${{ steps.unit.outcome }} audit=${{ steps.audit.outcome }}"
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.audit.outcome }}" = success

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        id: browser
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Browser smoke
        id: test
        if: always()
        continue-on-error: true
        run: npm run test:browser:chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Chromium verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outcome }} browser=${{ steps.browser.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.test.outcome }}" = success

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Install browser
        id: browser
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Browser smoke
        id: test
        if: always()
        continue-on-error: true
        run: npx playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ${{ matrix.browser }} verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outcome }} browser=${{ steps.browser.outcome }} build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"
          test "${{ steps.install.outcome }}" = success
          test "${{ steps.browser.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
