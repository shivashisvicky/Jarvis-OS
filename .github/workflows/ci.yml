name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never serialize commits on a branch. Every commit gets its own validation slot.
# This is deliberate for active stabilization: a new fix must execute immediately
# instead of waiting behind an older browser run.
concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Security audit
        run: npm audit --audit-level=critical

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: npm run test:browser:smoke -- --project=chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: npx playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
