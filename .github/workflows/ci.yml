name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: 10.15.0

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Verify static runtime assets
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/jarvis-media-layout.css
          test -s dist/jarvis-video-search-v3.css
          test -s dist/jarvis-youtube-config.js
          test -s dist/jarvis-module-loader.js
          test -s dist/jarvis-web-search.js
          test -s dist/jarvis-live-media.js
          test -s dist/jarvis-voice-authority.js
          grep -q 'assets/index-' dist/index.html
          grep -q 'jarvis-module-loader.js' dist/index.html
          ! grep -q 'jarvis-emergency-click-fix.js' dist/index.html
          ! grep -q 'jarvis-shell-tools.js' dist/index.html
          ! grep -q 'jarvis-live-media.js' dist/index.html
          ! grep -q 'jarvis-web-search.js' dist/index.html
          ! grep -q 'jarvis-voice-authority.js' dist/index.html
          ! grep -q 'jarvis-mobile-unified.js' dist/index.html
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Security audit
        run: pnpm audit --audit-level=critical

  video-demo:
    name: Video Demo / Real Keyword-to-Playback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install Node dependencies for browser gate
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium for browser gate
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Deno for yt-dlp YouTube EJS
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install demo dependencies
        working-directory: video-player-demo
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile demo
        run: python -m py_compile video-player-demo/server.py
      - name: Run demo contract tests
        working-directory: video-player-demo
        run: python -m unittest -v test_demo.py
      - name: Start demo service
        run: python -u video-player-demo/server.py > /tmp/jarvis-video-demo.log 2>&1 &
      - name: Health check
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url='http://127.0.0.1:8765/health'
          last=None
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      data=json.load(response)
                  assert data['ok'] is True, data
                  print(f'HEALTH_OK=1 attempt={attempt + 1}')
                  break
              except Exception as exc:
                  last=exc
                  time.sleep(0.5)
          else:
              raise SystemExit(f'Health check failed after 30 attempts: {last}')
          PY
      - name: Live keyword extraction gate
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          url='http://127.0.0.1:8765/api/search?q='+urllib.parse.quote('cats')
          with urllib.request.urlopen(url, timeout=60) as response:
              payload=json.load(response)
          result=payload['result']
          assert result['id'], result
          assert result['webpageUrl'].startswith(('https://www.youtube.com/','https://youtu.be/')), result
          assert result['embedUrl'].startswith('https://www.youtube-nocookie.com/embed/'), result
          print('LIVE_VIDEO_ID=', result['id'])
          print('LIVE_VIDEO_TITLE=', result['title'])
          print('LIVE_EMBED_URL_OK=1')
          PY
      - name: Browser playback gate
        run: node video-player-demo/smoke.mjs
      - name: Dump demo log on failure
        if: failure()
        run: cat /tmp/jarvis-video-demo.log

  python-media:
    name: Local Media / Python Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r jarvis-media/requirements.txt
      - name: Compile media service
        run: python -m compileall -q jarvis-media
      - name: Run deterministic media contract tests
        working-directory: jarvis-media
        run: python -m unittest -v test_media_agent.py

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Verify static runtime assets
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/jarvis-media-layout.css
          test -s dist/jarvis-video-search-v3.css
          test -s dist/jarvis-youtube-config.js
          test -s dist/jarvis-module-loader.js
          test -s dist/jarvis-web-search.js
          test -s dist/jarvis-live-media.js
          test -s dist/jarvis-voice-authority.js
          grep -q 'assets/index-' dist/index.html
          grep -q 'jarvis-module-loader.js' dist/index.html
          ! grep -q 'jarvis-emergency-click-fix.js' dist/index.html
          ! grep -q 'jarvis-shell-tools.js' dist/index.html
          ! grep -q 'jarvis-live-media.js' dist/index.html
          ! grep -q 'jarvis-web-search.js' dist/index.html
          ! grep -q 'jarvis-voice-authority.js' dist/index.html
          ! grep -q 'jarvis-mobile-unified.js' dist/index.html
      - name: Browser smoke
        run: pnpm run test:browser:smoke --project=chromium
      - name: Home intelligence + voice bridge gate
        run: pnpm exec playwright test tests/e2e/home-intelligence.spec.ts --project=chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  live-ebooks:
    name: Live / Gutenberg Ebooks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify deployed Gutenberg ebook reader
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/?deploy=${{ github.sha }}
        run: pnpm exec playwright test tests/e2e/live-ebooks.spec.ts --project=chromium
      - name: Upload ebook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-ebook-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
