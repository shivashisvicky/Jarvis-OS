name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Never cancel an in-flight validation run. Every pushed revision gets its full evidence set.
concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every validation lane is intentionally independent. A broken install/build/test
# in one lane must never prevent the other lanes from collecting evidence.
jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Unit tests
        id: unit
        if: always()
        continue-on-error: true
        run: npm test -- --reporter=dot
      - name: Security audit
        id: audit
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=critical
      - name: Quality verdict
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.install.outcome }}" "${{ steps.build.outcome }}" "${{ steps.unit.outcome }}" "${{ steps.audit.outcome }}"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Quality lane collected all checks, but one or more checks failed."
            exit 1
          fi

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        id: browser
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps chromium
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Browser smoke
        id: test
        if: always()
        continue-on-error: true
        run: npm run test:browser:smoke -- --project=chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Chromium verdict
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.install.outcome }}" "${{ steps.browser.outcome }}" "${{ steps.build.outcome }}" "${{ steps.test.outcome }}"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund
      - name: Install browser
        id: browser
        if: always()
        continue-on-error: true
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - name: Browser smoke
        id: test
        if: always()
        continue-on-error: true
        run: npx playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ${{ matrix.browser }} verdict
        if: always()
        run: |
          failed=0
          for outcome in "${{ steps.install.outcome }}" "${{ steps.browser.outcome }}" "${{ steps.build.outcome }}" "${{ steps.test.outcome }}"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
