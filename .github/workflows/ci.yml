name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        if: always()
        run: |
          set +e
          npm install --no-audit --no-fund
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build
        id: build
        if: always()
        run: |
          set +e
          npm run build
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Unit tests
        id: unit
        if: always()
        run: |
          set +e
          npm test -- --reporter=dot
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Security audit
        id: audit
        if: always()
        run: |
          set +e
          npm audit --audit-level=critical
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Quality verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }} unit=${{ steps.unit.outputs.exit_code }} audit=${{ steps.audit.outputs.exit_code }}"
          test "${{ steps.install.outputs.exit_code }}" = 0
          test "${{ steps.build.outputs.exit_code }}" = 0
          test "${{ steps.unit.outputs.exit_code }}" = 0
          test "${{ steps.audit.outputs.exit_code }}" = 0

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        if: always()
        run: |
          set +e
          npm install --no-audit --no-fund
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install Chromium
        id: browser
        if: always()
        run: |
          set +e
          npx playwright install --with-deps chromium
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build
        id: build
        if: always()
        run: |
          set +e
          npm run build
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Browser smoke
        id: test
        if: always()
        run: |
          set +e
          npm run test:browser:smoke -- --project=chromium
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Chromium verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outputs.exit_code }} browser=${{ steps.browser.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }} test=${{ steps.test.outputs.exit_code }}"
          test "${{ steps.install.outputs.exit_code }}" = 0
          test "${{ steps.browser.outputs.exit_code }}" = 0
          test "${{ steps.build.outputs.exit_code }}" = 0
          test "${{ steps.test.outputs.exit_code }}" = 0

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        id: install
        if: always()
        run: |
          set +e
          npm install --no-audit --no-fund
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Install browser
        id: browser
        if: always()
        run: |
          set +e
          npx playwright install --with-deps ${{ matrix.browser }}
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build
        id: build
        if: always()
        run: |
          set +e
          npm run build
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Browser smoke
        id: test
        if: always()
        run: |
          set +e
          npx playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: ${{ matrix.browser }} verdict
        if: always()
        run: |
          echo "install=${{ steps.install.outputs.exit_code }} browser=${{ steps.browser.outputs.exit_code }} build=${{ steps.build.outputs.exit_code }} test=${{ steps.test.outputs.exit_code }}"
          test "${{ steps.install.outputs.exit_code }}" = 0
          test "${{ steps.browser.outputs.exit_code }}" = 0
          test "${{ steps.build.outputs.exit_code }}" = 0
          test "${{ steps.test.outputs.exit_code }}" = 0
