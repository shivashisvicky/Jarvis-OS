name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.15.0

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm test -- --reporter=dot
      - name: Security audit
        run: pnpm audit --audit-level=critical

  video-demo:
    name: Video Demo / Real Keyword-to-Playback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Deno for yt-dlp YouTube EJS
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install demo dependencies
        working-directory: video-player-demo
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile demo
        run: python -m py_compile video-player-demo/server.py
      - name: Run demo contract tests
        working-directory: video-player-demo
        run: python -m unittest -v test_demo.py
      - name: Start demo service
        run: python video-player-demo/server.py > /tmp/jarvis-video-demo.log 2>&1 &
      - name: Health check
        run: python - <<'PY'
          import json, urllib.request
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=10))
          assert data['ok'] is True
          print('HEALTH_OK=1')
          PY
      - name: Live keyword extraction gate
        run: python - <<'PY'
          import json, urllib.parse, urllib.request
          url='http://127.0.0.1:8765/api/search?q='+urllib.parse.quote('cats')
          with urllib.request.urlopen(url, timeout=60) as response:
              payload=json.load(response)
          result=payload['result']
          assert result['id'], result
          assert result['webpageUrl'].startswith(('https://www.youtube.com/','https://youtu.be/')), result
          assert result['mediaUrl'].startswith('http'), result
          print('LIVE_VIDEO_ID=', result['id'])
          print('LIVE_VIDEO_TITLE=', result['title'])
          print('LIVE_MEDIA_URL_OK=1')
          PY
      - name: Browser playback gate
        run: node video-player-demo/smoke.mjs
      - name: Dump demo log on failure
        if: failure()
        run: cat /tmp/jarvis-video-demo.log

  python-media:
    name: Local Media / Python Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r jarvis-media/requirements.txt
      - name: Compile media service
        run: python -m compileall -q jarvis-media
      - name: Run deterministic media contract tests
        working-directory: jarvis-media
        run: python -m unittest -v test_media_agent.py

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Browser smoke
        run: pnpm run test:browser:smoke -- --project=chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: pnpm run build
      - name: Browser smoke
        run: pnpm exec playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
