name: Jarvis OS CI
on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
