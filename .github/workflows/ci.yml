name: Jarvis OS CI

on:
  push:
    branches: [main, 'build/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# Node 22 currently ships with newer npm releases that have an open Arborist
# regression which can crash with `Cannot read properties of null (reading
# 'edgesOut')` while resolving otherwise valid dependency graphs. Keep CI on
# the stable npm 10 line until that npm regression is resolved.
env:
  NPM_VERSION: 10.9.7

jobs:
  quality:
    name: Quality / Build / Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Security audit
        run: npm audit --audit-level=critical

  python-media:
    name: Local Media / Python Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r jarvis-media/requirements.txt
      - name: Compile media service
        run: python -m compileall -q jarvis-media
      - name: Run deterministic media contract tests
        working-directory: jarvis-media
        run: python -m unittest -v test_media_agent.py

  e2e-chromium:
    name: E2E / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: npm run test:browser:smoke -- --project=chromium
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chromium-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-cross-browser:
    name: E2E / ${{ matrix.browser }} Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Browser smoke
        run: npx playwright test tests/e2e/ci-smoke.spec.ts --project=${{ matrix.browser }}
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.browser }}-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
