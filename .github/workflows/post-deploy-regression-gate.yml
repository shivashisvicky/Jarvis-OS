name: Post-Deploy Regression Gate

on:
  workflow_run:
    workflows: ["Deploy Jarvis OS Dual Pages (TEST)"]
    types: [completed]
    branches: [test/jarvis-intelligence-next]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PNPM_VERSION: 10.15.0

concurrency:
  group: jarvis-post-deploy-regression-gate-test
  cancel-in-progress: true

jobs:
  sequential-command-gate:
    name: TEST Regression / Beowulf -> Newman -> Time -> Context
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify canonical TEST deployment succeeded
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          echo "UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100" > jobs.json
          python - <<'PY'
          import json
          data=json.load(open('jobs.json'))
          jobs=data.get('jobs',[])
          target=next((j for j in jobs if j.get('name')=='Deploy TEST environment'),None)
          if not target:
              raise SystemExit('DEPLOY_TEST_JOB_NOT_FOUND')
          print('DEPLOY_TEST_JOB_STATUS=',target.get('status'))
          print('DEPLOY_TEST_JOB_CONCLUSION=',target.get('conclusion'))
          if target.get('conclusion') != 'success':
              raise SystemExit('DEPLOY_TEST_JOB_NOT_SUCCESS')
          PY

      - name: Checkout deployed TEST commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify TEST shell in strict sequence
        env:
          JARVIS_LIVE_URL: https://shivashisvicky.github.io/Jarvis-OS/test/?deploy=${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "TEST_COMMIT=${JARVIS_LIVE_URL##*=}"
          pnpm exec playwright test tests/e2e/post-deploy-regression-gate.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Upload TEST regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-test-regression-evidence-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 21
