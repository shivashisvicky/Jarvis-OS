name: One-shot JARVIS media and news enhancement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis_enhance.py'
      - 'scripts/jarvis_retire_legacy_media.py'
      - '.github/workflows/jarvis-enhance.yml'
      - 'src/main.ts'
      - 'index.html'
      - 'jarvis-media-authority.js'
      - 'jarvis-runtime-guards.js'

permissions:
  contents: write

env:
  NPM_VERSION: 10.9.7

jobs:
  enhance:
    if: "!contains(github.event.head_commit.message, '[jarvis-enhance]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Retire legacy media runtime
        run: python3 scripts/jarvis_retire_legacy_media.py
      - name: Patch application
        run: python3 scripts/jarvis_enhance.py
      - name: Verify media authority contract
        run: |
          ! grep -n "setupMedia\|pipedapi" src/main.ts
          grep -n "jarvis-media-authority.js" index.html
      - name: Build
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Commit application changes
        run: |
          git config user.name 'JARVIS Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.ts src/styles.css tests/e2e/jarvis.spec.ts
          if git diff --cached --quiet; then
            echo 'No enhancement changes to commit.'
            exit 0
          fi
          git commit -m 'fix(media): permanently retire legacy media runtime [jarvis-enhance]'
          git push
