name: One-shot JARVIS media and news enhancement

on:
  push:
    branches: [main]
    paths:
      - 'scripts/jarvis_enhance.py'
      - '.github/workflows/jarvis-enhance.yml'

permissions:
  contents: write

env:
  NPM_VERSION: 10.9.7

jobs:
  enhance:
    if: "!contains(github.event.head_commit.message, '[jarvis-enhance]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Patch application
        run: python3 scripts/jarvis_enhance.py
      - name: Build
        run: npm run build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Commit application changes
        run: |
          git config user.name 'JARVIS Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.ts src/styles.css tests/e2e/jarvis.spec.ts
          if git diff --cached --quiet; then
            echo 'No enhancement changes to commit.'
            exit 0
          fi
          git commit -m 'feat: apply idempotent JARVIS enhancement [jarvis-enhance]'
          git push
