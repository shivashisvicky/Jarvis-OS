name: JARVIS media CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'jarvis-media-final.js'
      - 'jarvis-runtime-guards.js'
      - 'tests/e2e/**'
      - 'scripts/jarvis_retire_legacy_media.py'
      - 'scripts/refresh_media_providers.py'
      - 'package.json'
      - 'playwright.config.ts'
      - '.github/workflows/jarvis-enhance.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_VERSION: 10.9.7

jobs:
  media-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION} && npm --version
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Refresh public video provider registry
        run: python3 scripts/refresh_media_providers.py
      - name: Retire legacy in-app media runtime
        run: python3 scripts/jarvis_retire_legacy_media.py
      - name: Verify media authority contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/jarvis_retire_legacy_media.py scripts/refresh_media_providers.py
          node --check jarvis-media-final.js
          node --check jarvis-runtime-guards.js
          if grep -nE 'setupMedia|pipedapi' src/main.ts; then
            echo 'ERROR: legacy media runtime/provider reference remains in src/main.ts'
            exit 1
          fi
          test -f jarvis-media-final.js
          test "$(grep -c 'jarvis-media-final\.js' index.html)" -eq 1
          test "$(grep -c 'jarvis-media-authority\.js' index.html || true)" -eq 0
          test "$(grep -c 'jarvis-media-runtime-watchdog\.js' index.html || true)" -eq 0
          echo 'MEDIA_AUTHORITY_CONTRACT_OK=1'
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Deterministic browser suite
        run: npm run test:browser
      - name: Live media smoke gate
        run: npx playwright test tests/e2e/ci-smoke.spec.ts -g 'LIVE:' --project=chromium --reporter=line
      - name: Commit CI-generated media maintenance
        run: |
          set -euo pipefail
          git config user.name 'JARVIS Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.ts jarvis-media-final.js
          if git diff --cached --quiet; then
            echo 'No CI-generated media maintenance changes were necessary.'
            exit 0
          fi
          git commit -m 'fix(media): refresh providers and retire legacy runtime [jarvis-ci]'
          git push
