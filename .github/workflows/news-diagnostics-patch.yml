name: News Diagnostics Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[news-diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch news timeout and diagnostics
        run: |
          python3 <<'PY'
          from pathlib import Path

          worker = Path('workers/intelligence/src/index.js')
          s = worker.read_text()
          if 'async function fetchWithTimeout' not in s:
              marker = 'async function searchGdelt(query) {'
              helper = '''async function fetchWithTimeout(url, options = {}, timeoutMs = 7000, provider = 'upstream') {\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), timeoutMs);\n  try {\n    return await fetch(url, { ...options, signal: controller.signal });\n  } catch (error) {\n    if (error?.name === 'AbortError') {\n      throw Object.assign(new Error(`${provider} upstream timeout after ${timeoutMs}ms`), { status: 504, code: 'UPSTREAM_TIMEOUT', provider });\n    }\n    throw Object.assign(new Error(error?.message || `${provider} upstream request failed`), { status: 502, code: 'UPSTREAM_FETCH_FAILED', provider });\n  } finally {\n    clearTimeout(timer);\n  }\n}\n\n'''
              s = s.replace(marker, helper + marker, 1)
          s = s.replace("const response = await fetch(target.toString(), { headers: { Accept: 'application/json' } });", "const response = await fetchWithTimeout(target.toString(), { headers: { Accept: 'application/json' } }, 7000, 'gdelt');", 1)
          s = s.replace("const response = await fetch(target.toString(), { headers: { Accept: 'application/rss+xml, application/xml, text/xml' } });", "const response = await fetchWithTimeout(target.toString(), { headers: { Accept: 'application/rss+xml, application/xml, text/xml' } }, 7000, 'google-news-rss');", 1)
          old = '''async function searchNews(query) {\n  try {\n    const results = await searchGdelt(query);\n    if (results.length) return { results, provider: 'gdelt' };\n  } catch {}\n  const results = await searchGoogleNews(query);\n  return { results, provider: 'google-news-rss' };\n}'''
          new = '''async function searchNews(query) {\n  const failures = [];\n  try {\n    const results = await searchGdelt(query);\n    if (results.length) return { results, provider: 'gdelt', diagnostics: { attempted: ['gdelt'], failures: [] } };\n    failures.push({ provider: 'gdelt', status: 502, code: 'NO_RESULTS', error: 'GDELT returned no articles' });\n  } catch (error) {\n    failures.push({ provider: error?.provider || 'gdelt', status: error?.status || 502, code: error?.code || 'UPSTREAM_FAILED', error: error?.message || 'GDELT request failed' });\n  }\n  try {\n    const results = await searchGoogleNews(query);\n    return { results, provider: 'google-news-rss', diagnostics: { attempted: ['gdelt', 'google-news-rss'], failures } };\n  } catch (error) {\n    failures.push({ provider: error?.provider || 'google-news-rss', status: error?.status || 502, code: error?.code || 'UPSTREAM_FAILED', error: error?.message || 'Google News request failed' });\n    throw Object.assign(new Error('All configured news providers failed'), { status: 502, code: 'NEWS_UPSTREAM_FAILED', providers: failures });\n  }\n}'''
          if old not in s:
              raise SystemExit('searchNews block not found')
          s = s.replace(old, new, 1)
          oldcatch = "return json({ error: error?.message || 'Search failed', code: 'SEARCH_FAILED', results: [] }, 502, origin);"
          newcatch = "return json({ error: error?.message || 'Search failed', code: error?.code || 'SEARCH_FAILED', providers: error?.providers || [], results: [], query }, error?.status || 502, origin);"
          if oldcatch not in s:
              raise SystemExit('search endpoint catch not found')
          s = s.replace(oldcatch, newcatch, 1)
          worker.write_text(s)

          main = Path('src/main.ts')
          s = main.read_text()
          old = '''async function fetchNewsQuery(query:string,controller:AbortController){const endpoint=`${newsEndpoint()}?q=${encodeURIComponent(query)}`;const response=await fetch(endpoint,{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});const data=await response.json().catch(()=>({}));if(!response.ok||!Array.isArray(data?.results)||!data.results.length)throw new Error(data?.error||`news HTTP ${response.status}`);return data}'''
          new = '''async function fetchNewsQuery(query:string,controller:AbortController){const endpoint=`${newsEndpoint()}?q=${encodeURIComponent(query)}`;const timeout=new Promise<never>((_,reject)=>window.setTimeout(()=>reject(Object.assign(new Error('Gateway timeout after 10000ms'),{code:'CLIENT_TIMEOUT'})),10000));const request=fetch(endpoint,{headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});const response=await Promise.race([request,timeout]);const data=await response.json().catch(()=>({}));if(!response.ok||!Array.isArray(data?.results)||!data.results.length){const detail=data?.error||`news HTTP ${response.status}`;const error=Object.assign(new Error(detail),{status:response.status,code:data?.code||'NEWS_REQUEST_FAILED',providers:data?.providers||[]});throw error}return data}'''
          if old not in s:
              raise SystemExit('fetchNewsQuery block not found')
          s = s.replace(old, new, 1)
          old = "}catch(error){if(controller.signal.aborted)return;status.textContent='DEGRADED';cards.innerHTML='<div class=\"news-empty\">Live news is temporarily unavailable. Try REFRESH.</div>';console.warn('JARVIS news load failed',error)}}"
          new = "}catch(error){if(controller.signal.aborted)return;const e=error as Error&{status?:number;code?:string;providers?:Array<{provider?:string;status?:number;code?:string;error?:string}>};status.textContent='DEGRADED';const providerInfo=(e.providers||[]).map(p=>`${p.provider||'provider'} ${p.status||''} ${p.code||''}: ${p.error||''}`.trim()).join(' | ');cards.innerHTML=`<div class=\"news-empty\"><strong>News gateway diagnostic</strong><br>${esc(e.message||'Request failed')}<br><small>HTTP ${e.status||'n/a'} · ${esc(e.code||'UNKNOWN')}${providerInfo?`<br>${esc(providerInfo)}`:''}</small></div>`;console.warn('JARVIS news load failed',error)}}"
          if old not in s:
              raise SystemExit('loadNews catch block not found')
          s = s.replace(old, new, 1)
          main.write_text(s)
          PY

      - name: Commit diagnostics patch
        run: |
          git config user.name "JARVIS CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ts workers/intelligence/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Diagnose news gateway timeouts [news-diagnostics]"
          git push
