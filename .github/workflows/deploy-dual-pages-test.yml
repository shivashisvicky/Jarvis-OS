name: Deploy Jarvis OS Dual Pages (TEST)

on:
  push:
    branches: ['test/jarvis-intelligence-next']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PNPM_VERSION: 10.15.0
  PROD_BRANCH: main
  TEST_BRANCH: test/jarvis-intelligence-next

concurrency:
  group: jarvis-pages-dual-test
  cancel-in-progress: true

jobs:
  build:
    name: Build PROD + TEST Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: test-src

      - name: Checkout PROD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROD_BRANCH }}
          path: prod-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version

      - name: Install PROD dependencies
        working-directory: prod-src
        run: pnpm install --no-frozen-lockfile

      - name: Install TEST dependencies
        working-directory: test-src
        run: pnpm install --no-frozen-lockfile

      - name: Build PROD
        working-directory: prod-src
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build

      - name: Build TEST
        working-directory: test-src
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build

      - name: Configure Intelligence endpoint in both builds
        env:
          JARVIS_INTELLIGENCE_ENDPOINT: ${{ secrets.JARVIS_INTELLIGENCE_ENDPOINT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re
          endpoint = (os.environ.get('JARVIS_INTELLIGENCE_ENDPOINT') or 'https://jarvis-intelligence.shivashisvicky112.workers.dev').strip().rstrip('/')
          for root in (Path('prod-src/dist'), Path('test-src/dist')):
              p = root / 'index.html'
              text = p.read_text()
              pattern = r'<meta\s+name="jarvis-intelligence-endpoint"\s+content="[^"]*"\s*/?>'
              replacement = f'<meta name="jarvis-intelligence-endpoint" content="{endpoint}/api/openai-intelligence">'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Intelligence endpoint meta tag not found: {p}')
              p.write_text(text)
          print('JARVIS dual Pages: intelligence endpoint configured')
          PY

      - name: Assemble dual Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/test
          cp -a prod-src/dist/. _site/
          cp -a test-src/dist/. _site/test/
          test -s _site/index.html
          test -s _site/test/index.html
          test -s _site/jarvis-youtube-config.js
          test -s _site/test/jarvis-youtube-config.js
          grep -q 'jarvis-intelligence-endpoint' _site/index.html
          grep -q 'jarvis-intelligence-endpoint' _site/test/index.html
          echo 'JARVIS dual Pages artifact assembled: / = PROD, /test/ = TEST'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dual Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy dual Pages TEST
    needs: build
    environment:
      name: github-pages-test
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  smoke:
    name: Verify PROD + TEST URLs
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production URL
        run: |
          set -euo pipefail
          url='https://shivashisvicky.github.io/Jarvis-OS/?dual=${{ github.sha }}'
          body=$(curl --silent --show-error --fail --max-time 30 "$url")
          printf '%s' "$body" | grep -q 'J.A.R.V.I.S'
          printf '%s' "$body" | grep -q 'assets/index-'
          echo 'PROD_URL_PASS'

      - name: Verify test URL
        run: |
          set -euo pipefail
          url='https://shivashisvicky.github.io/Jarvis-OS/test/?dual=${{ github.sha }}'
          body=$(curl --silent --show-error --fail --max-time 30 "$url")
          printf '%s' "$body" | grep -q 'J.A.R.V.I.S'
          printf '%s' "$body" | grep -q 'assets/index-'
          echo 'TEST_URL_PASS'

# Intentionally retriggered to publish the current TEST branch state.
