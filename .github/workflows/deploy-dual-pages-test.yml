name: Deploy Jarvis OS Dual Pages (TEST)

on:
  push:
    branches:
      - test/jarvis-intelligence-next
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PNPM_VERSION: 10.15.0
  PROD_BRANCH: main
  TEST_BRANCH: test/jarvis-intelligence-next

concurrency:
  group: jarvis-pages-dual-test
  cancel-in-progress: true

jobs:
  build:
    name: Build TEST + frozen PROD baseline
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/test/jarvis-intelligence-next'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: test-src

      - name: Checkout PROD baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROD_BRANCH }}
          path: prod-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION} && pnpm --version

      - name: Install PROD baseline dependencies
        working-directory: prod-src
        run: pnpm install --no-frozen-lockfile

      - name: Install TEST dependencies
        working-directory: test-src
        run: pnpm install --no-frozen-lockfile

      - name: Build frozen PROD baseline
        working-directory: prod-src
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build

      - name: Build TEST
        working-directory: test-src
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: pnpm run build

      - name: Configure Intelligence endpoint in both builds
        env:
          JARVIS_INTELLIGENCE_ENDPOINT: ${{ secrets.JARVIS_INTELLIGENCE_ENDPOINT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re

          endpoint = (os.environ.get('JARVIS_INTELLIGENCE_ENDPOINT') or 'https://jarvis-intelligence.shivashisvicky112.workers.dev').strip().rstrip('/')

          def configure(root):
              p = Path(root) / 'index.html'
              text = p.read_text()
              pattern = r'<meta\s+[^>]*name=["\']jarvis-intelligence-endpoint["\'][^>]*>'
              match = re.search(pattern, text, flags=re.IGNORECASE)
              marker = f'<meta name="jarvis-intelligence-endpoint" content="{endpoint}/api/openai-intelligence">'
              if not match:
                  head = re.search(r'</head\s*>', text, flags=re.IGNORECASE)
                  if not head:
                      raise SystemExit(f'HTML head not found: {p}')
                  text = text[:head.start()] + marker + text[head.start():]
              else:
                  tag = match.group(0)
                  if re.search(r'content=["\'][^"\']*["\']', tag, flags=re.IGNORECASE):
                      tag = re.sub(r'content=["\'][^"\']*["\']', f'content="{endpoint}/api/openai-intelligence"', tag, count=1, flags=re.IGNORECASE)
                  else:
                      tag = tag[:-1] + f' content="{endpoint}/api/openai-intelligence">'
                  text = text[:match.start()] + tag + text[match.end():]
              p.write_text(text)
              print(f'JARVIS_INTELLIGENCE_ENDPOINT_CONFIGURED=1 ({p})')

          configure('prod-src/dist')
          configure('test-src/dist')
          PY

      - name: Assemble TEST + frozen PROD artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/test
          cp -a prod-src/dist/. _site/
          cp -a test-src/dist/. _site/test/
          test -s _site/index.html
          test -s _site/test/index.html
          test -s _site/jarvis-youtube-config.js
          test -s _site/test/jarvis-youtube-config.js
          grep -q 'jarvis-intelligence-endpoint' _site/index.html
          grep -q 'jarvis-intelligence-endpoint' _site/test/index.html
          grep -q 'J.A.R.V.I.S' _site/index.html
          grep -q 'J.A.R.V.I.S' _site/test/index.html
          echo 'JARVIS Pages artifact: / = frozen PROD baseline, /test/ = TEST experiment'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload TEST artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy TEST environment
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/test/jarvis-intelligence-next'
    needs: build
    environment:
      name: github-pages-test
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy TEST environment
        uses: actions/deploy-pages@v4
        id: deployment

  smoke:
    name: Verify frozen PROD + TEST URLs
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/test/jarvis-intelligence-next'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify frozen production URL
        run: |
          set -euo pipefail
          url='https://shivashisvicky.github.io/Jarvis-OS/?dual=${{ github.sha }}'
          body=$(curl --silent --show-error --fail --max-time 30 "$url")
          printf '%s' "$body" | grep -q 'J.A.R.V.I.S'
          printf '%s' "$body" | grep -q 'assets/index-'
          echo 'FROZEN_PROD_URL_PASS'

      - name: Verify TEST URL
        run: |
          set -euo pipefail
          url='https://shivashisvicky.github.io/Jarvis-OS/test/?dual=${{ github.sha }}'
          body=$(curl --silent --show-error --fail --max-time 30 "$url")
          printf '%s' "$body" | grep -q 'J.A.R.V.I.S'
          printf '%s' "$body" | grep -q 'assets/index-'
          echo 'TEST_URL_PASS'

# TEST branch is the automatic experiment path. PROD is read from main as a frozen baseline only.
