name: Authority Syntax Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Active authority syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check active authority scripts
        run: |
          node --check jarvis-entity-authority-v2.js
          node --check jarvis-ebook-authority-v2.js
