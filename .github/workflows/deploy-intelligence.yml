name: Deploy JARVIS Intelligence Gateway

on:
  push:
    branches: [main]
    paths:
      - 'workers/intelligence/**'
      - '.github/workflows/deploy-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Intelligence Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check gateway configuration
        id: config
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_SECRET=$name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Gateway deployment skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and GEMINI_API_KEY in GitHub Actions secrets.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 22
      - name: Validate Worker
        if: steps.config.outputs.configured == 'true'
        run: node --check workers/intelligence/src/index.js
      - name: Inject deployment bindings
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('wrangler.toml')
          text = p.read_text()
          token = '__CLOUDFLARE_ACCOUNT_ID__'
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          if token not in text:
              raise SystemExit('Cloudflare account placeholder not found in wrangler.toml')
          p.write_text(text.replace(token, account, 1))
          PY
      - name: Deploy Worker
        if: steps.config.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/intelligence
      - name: Configure Gemini Worker secret
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
      - name: Verify deployed Worker directly
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          endpoint='https://jarvis-intelligence.shivashisvicky112.workers.dev'
          echo "Testing deployed intelligence endpoint: $endpoint"
          response=$(curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST "$endpoint/" \
            --data '{"query":"Reply with exactly: JARVIS ONLINE"}')
          printf '%s\n' "$response"
          RESPONSE="$response" python - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          assert str(data.get('text') or '').strip(), 'Worker returned no text'
          assert data.get('provider') == 'gemini', f"unexpected provider: {data.get('provider')}"
          assert data.get('model') == 'gemini-2.5-flash', f"unexpected model: {data.get('model')}"
          print('INTELLIGENCE_WORKER_SMOKE=PASS')
          PY