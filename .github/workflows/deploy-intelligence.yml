name: Deploy JARVIS Intelligence Gateway

on:
  push:
    branches: [main]
    paths:
      - 'workers/intelligence/**'
      - '.github/workflows/deploy-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Intelligence Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check gateway configuration
        id: config
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub secret: $name"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker
        run: node --check workers/intelligence/src/index.js

      - name: Prepare Wrangler configuration
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('wrangler.toml')
          text = p.read_text()
          text = text.replace('__CLOUDFLARE_ACCOUNT_ID__', os.environ['CLOUDFLARE_ACCOUNT_ID'].strip(), 1)
          p.write_text(text)
          PY
          cat wrangler.toml

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker with Wrangler
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          wrangler deploy --name jarvis-intelligence

      - name: Configure Gemini Worker secret
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --name jarvis-intelligence

      - name: Show live deployment
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          wrangler deployments list --name jarvis-intelligence

      - name: Verify workers.dev health
        run: |
          set -euo pipefail
          endpoint='https://jarvis-intelligence.shivashisvicky112.workers.dev'
          echo "GET $endpoint/"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors "$endpoint/"

      - name: Verify Gemini intelligence
        run: |
          set -euo pipefail
          endpoint='https://jarvis-intelligence.shivashisvicky112.workers.dev/api/intelligence'
          echo "POST $endpoint"
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -X POST "$endpoint" \
            --data '{"query":"Reply with exactly: JARVIS ONLINE"}')
          printf '%s\n' "$response"
          RESPONSE="$response" python - <<'PY'
          import json, os
          data = json.loads(os.environ['RESPONSE'])
          assert str(data.get('text') or '').strip(), 'Worker returned no text'
          assert data.get('provider') == 'gemini', f"unexpected provider: {data.get('provider')}"
          assert data.get('model') == 'gemini-2.5-flash', f"unexpected model: {data.get('model')}"
          print('INTELLIGENCE_WORKER_SMOKE=PASS')
          PY