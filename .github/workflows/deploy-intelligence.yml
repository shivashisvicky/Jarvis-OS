name: Deploy JARVIS Intelligence Gateway

on:
  push:
    branches: [main]
    paths:
      - 'workers/intelligence/**'
      - '.github/workflows/deploy-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Intelligence Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check gateway configuration
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing GitHub secret: $name"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker
        run: node --check workers/intelligence/src/index.js
      - name: Prepare Wrangler configuration
        working-directory: workers/intelligence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('wrangler.toml')
          text = p.read_text()
          text = text.replace('__CLOUDFLARE_ACCOUNT_ID__', os.environ['CLOUDFLARE_ACCOUNT_ID'].strip(), 1)
          p.write_text(text)
          PY
          cat wrangler.toml
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Deploy Worker with Wrangler
        working-directory: workers/intelligence
        run: wrangler deploy --name jarvis-intelligence
      - name: Configure Gemini Worker secret
        working-directory: workers/intelligence
        run: printf '%s' "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY --name jarvis-intelligence
      - name: Show live deployment
        working-directory: workers/intelligence
        run: wrangler deployments list --name jarvis-intelligence
      - name: Verify intelligence POST only
        run: |
          set -euo pipefail
          endpoint='https://jarvis-intelligence.shivashisvicky112.workers.dev/api/intelligence'
          http_code=$(curl --silent --show-error --output /tmp/jarvis-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "$endpoint" --data '{"query":"Reply with exactly: JARVIS ONLINE"}')
          cat /tmp/jarvis-response.json
          echo "HTTP_STATUS=$http_code"
          RESPONSE="$(cat /tmp/jarvis-response.json)" HTTP_CODE="$http_code" python - <<'PY'
          import json, os
          code = int(os.environ['HTTP_CODE'])
          data = json.loads(os.environ['RESPONSE'])
          if code != 200: raise SystemExit(f"POST failed with HTTP {code}: {data}")
          assert str(data.get('text') or '').strip(), 'Worker returned no text'
          assert data.get('provider') in {'gemini', 'groq'}, f"unexpected provider: {data.get('provider')}"
          print(f"INTELLIGENCE_WORKER_SMOKE=PASS provider={data.get('provider')} model={data.get('model')}")
          PY
      - name: Verify streaming JARVIS TTS
        run: |
          set -euo pipefail
          endpoint='https://jarvis-intelligence.shivashisvicky112.workers.dev/api/tts'
          status=$(curl --silent --show-error --no-buffer --max-time 45 -D /tmp/jarvis-tts.headers -o /tmp/jarvis-tts.body -w '%{http_code}' -H 'Content-Type: application/json' -H 'Accept: text/event-stream, audio/wav' -X POST "$endpoint" --data '{"text":"JARVIS online.","rate":0.92}')
          echo "HTTP_STATUS=$status"
          cat /tmp/jarvis-tts.headers
          test "$status" = 200
          test -s /tmp/jarvis-tts.body
          python - <<'PY'
          import base64, json
          from pathlib import Path
          headers = Path('/tmp/jarvis-tts.headers').read_text(errors='replace').lower()
          body = Path('/tmp/jarvis-tts.body').read_bytes()
          if 'content-type: text/event-stream' in headers:
              text = body.decode('utf-8', errors='replace')
              audio_bytes = 0
              for line in text.splitlines():
                  if not line.startswith('data:'):
                      continue
                  payload = line[5:].strip()
                  if not payload or payload == '[DONE]':
                      continue
                  try:
                      event = json.loads(payload)
                  except json.JSONDecodeError:
                      continue
                  delta = event.get('delta') or {}
                  if event.get('event_type') == 'step.delta' and delta.get('type') == 'audio' and delta.get('data'):
                      audio_bytes += len(base64.b64decode(delta['data']))
              assert audio_bytes > 0, 'stream returned no audio deltas'
              print(f'TTS_STREAM_SMOKE=PASS pcm_bytes={audio_bytes}')
          else:
              assert body[:4] == b'RIFF', f'fallback is not WAV: {body[:12]!r}'
              assert body[8:12] == b'WAVE', 'fallback missing WAVE header'
              assert len(body) > 44, 'fallback audio payload is empty'
              print(f'TTS_FALLBACK_SMOKE=PASS wav_bytes={len(body)}')
          PY
