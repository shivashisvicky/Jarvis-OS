name: Apply News Client Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-news-client-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace client news loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/main.ts')
          text = p.read_text()
          pattern = r'async function loadNews\(category:string\)\{[\s\S]*?\nasync function bootstrap\(\)'
          replacement = '''async function loadNews(category:string){
            const status=document.querySelector('#newsStatus');
            const cards=document.querySelector('#newsCards');
            if(!status||!cards)return;
            const key=category||'WORLD';
            newsAbort?.abort();
            const controller=new AbortController();
            newsAbort=controller;
            status.textContent='SCANNING';
            cards.innerHTML='<div class="news-empty">Fetching live intelligence…</div>';
            const query=queryFor(key);
            const trace=`JARVIS-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
            console.info('[JARVIS NEWS START]',{trace,category:key,query,provider:'gateway'});
            const timer=abortAfter(controller,12000);
            try{
              const started=performance.now();
              const items=await gatewayNews(query,controller.signal);
              const latencyMs=Math.round(performance.now()-started);
              if(!items.length)throw new Error('Gateway returned zero articles');
              console.info('[JARVIS NEWS SUCCESS]',{trace,category:key,count:items.length,latencyMs});
              renderNews(items);
              newsCache.set(key,cards.innerHTML);
              status.textContent=`${Math.min(5,items.length)} RESULTS · LIVE`;
            }catch(error){
              const message=error instanceof Error?error.message:String(error);
              if(controller.signal.aborted){
                status.textContent='DEGRADED';
                cards.innerHTML='<div class="news-empty">News gateway timed out after 12s.</div>';
                console.error('[JARVIS NEWS TIMEOUT]',{trace,category:key,message});
              }else{
                status.textContent='DEGRADED';
                cards.innerHTML=`<div class="news-empty">News gateway unavailable. ${esc(message)}</div>`;
                console.error('[JARVIS NEWS FAILED]',{trace,category:key,error:message});
              }
            }finally{window.clearTimeout(timer)}
          }
          async function bootstrap()'''
          patched,n=re.subn(pattern,replacement,text,count=1)
          if n!=1:
              raise SystemExit('Expected exactly one loadNews block; found '+str(n))
          p.write_text(patched)
          PY

      - name: Validate TypeScript source
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/main.ts','utf8'); if(!s.includes(\"provider:'gateway'\")) process.exit(1); console.log('NEWS_CLIENT_GATEWAY_FIX=1')"

      - name: Commit patched client
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Home News client to use intelligence gateway'
          git push origin main
