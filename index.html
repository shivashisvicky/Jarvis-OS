  <script>
    (() => {
      if (window.__jarvisNewsCategorySwitch) return;
      window.__jarvisNewsCategorySwitch = true;
      document.addEventListener('change', event => {
        const target = event.target;
        if (!(target instanceof HTMLSelectElement) || target.id !== 'newsGenre') return;
        window.requestAnimationFrame(() => {
          const refresh = document.querySelector('#refreshNews');
          if (refresh instanceof HTMLButtonElement && !refresh.disabled) refresh.click();
        });
      });
    })();
  </script>
