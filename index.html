<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="J.A.R.V.I.S. personal intelligence workspace">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./jarvis-media-layout.css?v=20260820-18">
  <link rel="stylesheet" href="./jarvis-video-search-v3.css?v=20260820-18">
  <link rel="stylesheet" href="./jarvis-futuristic-hud.css?v=20260820-21">
  <title>J.A.R.V.I.S. OS</title>
</head>
<body>
  <div id="app"></div>
  <script async src="./jarvis-youtube-config.js?v=20260820-11"></script>
  <script async src="./jarvis-voice-bridge.js?v=20260820-8"></script>
  <script async src="./jarvis-performance.js?v=20260820-7"></script>
  <script type="module" async src="./src/main.ts?v=20260820-command-v10"></script>
  <script async src="./jarvis-web-search-runtime.js?v=20260820-8"></script>
  <script async src="./jarvis-command-runtime.js?v=20260820-5"></script>
  <script async src="./jarvis-os-3-command-authority.js?v=20260820-3"></script>
  <script async src="./jarvis-os-3-map-intent.js?v=20260820-3"></script>
  <script async src="./jarvis-os-3-news-runtime.js?v=20260820-3"></script>
  <script async src="./jarvis-media-hotfix.js?v=20260820-8"></script>
  <script async src="./jarvis-os-3-media-ui.js?v=20260820-4"></script>
  <script async src="./jarvis-os-3-media-authority.js?v=20260820-2"></script>
  <script async src="./jarvis-direct-url-runtime.js?v=20260820-5"></script>
  <script async src="./jarvis-hud-runtime.js?v=20260820-4"></script>
  <script async src="./jarvis-os-3-news-authority.js?v=20260820-4"></script>
  <script>
    (() => {
      const idOf = value => {
        try {
          const u = new URL(String(value).trim());
          const h = u.hostname.replace(/^www\./, '').toLowerCase();
          if (h === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || null;
          if (h === 'youtube.com' || h === 'm.youtube.com') {
            if (u.pathname === '/watch') return u.searchParams.get('v');
            const p = u.pathname.split('/').filter(Boolean);
            if (['shorts','live','embed'].includes(p[0])) return p[1] || null;
          }
        } catch {}
        return /^[A-Za-z0-9_-]{11}$/.test(String(value).trim()) ? String(value).trim() : null;
      };
      document.addEventListener('click', event => {
        const button = event.target instanceof Element ? event.target.closest('#videoSearch') : null;
        if (!button) return;
        const input = document.querySelector('#videoQuery');
        const id = input ? idOf(input.value) : null;
        if (!id) return;
        const player = document.querySelector('#jarvisPlayer');
        if (!player) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        player.dataset.videoId = id;
        const frame = document.createElement('iframe');
        frame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&controls=1&playsinline=1&rel=0`;
        frame.title = 'JARVIS YouTube player';
        frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        player.replaceChildren(frame);
        window.dispatchEvent(new CustomEvent('jarvis:media-direct-play', { detail: { id, src: frame.src } }));
      }, true);
    })();
  </script>
</body>
</html>
