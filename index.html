<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="J.A.R.V.I.S. personal intelligence workspace">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./jarvis-media-layout.css?v=20260820-11">
  <link rel="stylesheet" href="./jarvis-video-search-v3.css?v=20260820-11">
  <title>J.A.R.V.I.S. OS</title>
</head>
<body>
  <div id="app">
    <button class="nav" data-app="media" type="button" aria-label="Media">▶ <span>Media</span></button>
    <main id="mediaBootFallback" hidden>
      <input id="videoQuery" type="search" autocomplete="off" placeholder="Search YouTube videos…">
      <button id="videoSearch" type="button">SEARCH</button>
      <div id="mediaState"></div>
      <div id="videoResults"></div>
      <div id="jarvisPlayer"></div>
    </main>
  </div>
  <script src="./jarvis-youtube-config.js?v=20260820-4"></script>
  <script src="./jarvis-performance.js?v=20260820-1"></script>
  <script src="./jarvis-video-provider.js?v=20260820-3"></script>
  <script type="module" src="./src/main.ts?v=20260820-media-v24"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      const fallback = document.getElementById('mediaBootFallback');
      const mediaNav = app?.querySelector('button.nav[data-app="media"]');
      const activateFallback = () => {
        if (!app || app.querySelector('.os')) return;
        if (!mediaNav || !fallback) return;
        mediaNav.addEventListener('click', () => {
          fallback.hidden = false;
          mediaNav.hidden = true;
        }, { once: true });
      };
      activateFallback();
      window.setTimeout(activateFallback, 1000);
      window.setTimeout(activateFallback, 5000);

      // The SPA recreates Media controls during navigation. Keep the provider's
      // search action authoritative at the document capture boundary so the
      // shell's generic button handlers cannot swallow direct YouTube URLs.
      document.addEventListener('click', event => {
        const target = event.target;
        const button = target instanceof Element ? target.closest('#videoSearch') : null;
        if (!button || typeof window.jarvisVideoSearch !== 'function') return;
        const input = document.getElementById('videoQuery');
        if (!input) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        void window.jarvisVideoSearch(input.value);
      }, true);
    })();
  </script>
</body>
</html>
